inject:
  head:
    - |
      <script>
        (function () {
          if (window.util) return;

          window.util = {
            viewportLazyload: function (el, callback, lazyload) {
              if (!el || typeof callback !== 'function') return;
              if (el.dataset.utilLazyloaded === '1') return;
              var runOnce = function () {
                if (el.dataset.utilLazyloaded === '1') return;
                el.dataset.utilLazyloaded = '1';
                callback();
              };
              if (!lazyload) {
                runOnce();
                return;
              }
              if (!('IntersectionObserver' in window)) {
                runOnce();
                return;
              }
              var loaded = false;
              var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                  if (!loaded && entry.isIntersecting) {
                    loaded = true;
                    observer.disconnect();
                    runOnce();
                  }
                });
              }, { rootMargin: '100px 0px' });
              observer.observe(el);
            },
            toggle: function (id) {
              var el = document.getElementById(id);
              if (!el) return;
              var hidden = el.style.height === '0px' || el.style.opacity === '0';
              if (hidden) {
                el.style.opacity = '1';
                el.style.height = 'auto';
              } else {
                el.style.opacity = '0';
                el.style.height = '0';
              }
            },
            copy: function (id, message) {
              var el = document.getElementById(id);
              if (!el) return;
              var text = el.value || el.textContent || '';
              var done = function () {
                if (message) console.log(message);
              };
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(function () {});
                return;
              }
              var area = document.createElement('textarea');
              area.value = text;
              document.body.appendChild(area);
              area.select();
              try { document.execCommand('copy'); } catch (e) {}
              document.body.removeChild(area);
              done();
            },
            scrollTop: function () {
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          };
        })();
      </script>

